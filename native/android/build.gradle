buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'                 // Capacitor 7 기준 버전
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'      // 다운로더 플러그인(Kotlin)용
    }
}

apply from: 'variables.gradle'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
